services:
  - type: web
    name: morphix
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install -g pnpm && pnpm install && pnpm run build
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: OPENAI_API_KEY
        sync: false        # Set this in Render dashboard
      - key: GEMINI_API_KEY
        sync: false        # Set this in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: OAUTH_SERVER_URL
        value: ""
      - key: VITE_APP_ID
        value: morphix-production
